name: Generate Screenshots

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'screenshots/results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysql, gd, zip

      - name: Install WordPress
        run: |
          # Download WordPress
          mkdir -p /tmp/wordpress
          curl -sL https://wordpress.org/latest.tar.gz | tar xz -C /tmp/wordpress --strip-components=1

          # Create wp-config
          cp /tmp/wordpress/wp-config-sample.php /tmp/wordpress/wp-config.php
          sed -i "s/database_name_here/wordpress/" /tmp/wordpress/wp-config.php
          sed -i "s/username_here/root/" /tmp/wordpress/wp-config.php
          sed -i "s/password_here/root/" /tmp/wordpress/wp-config.php
          sed -i "s/localhost/127.0.0.1/" /tmp/wordpress/wp-config.php

          # Install WP-CLI
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

          # Install WordPress
          cd /tmp/wordpress
          wp core install --url=http://localhost:8080 --title="Escalated Demo" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --allow-root

          # Install plugin Composer dependencies
          cd $GITHUB_WORKSPACE
          composer install --no-interaction --prefer-dist 2>/dev/null || true

          # Link plugin into WordPress
          ln -s $GITHUB_WORKSPACE /tmp/wordpress/wp-content/plugins/escalated

          # Activate plugin (triggers activation hook which creates roles/tables)
          cd /tmp/wordpress
          wp plugin activate escalated --allow-root 2>&1 || echo "Plugin activation had warnings"
          wp plugin list --allow-root

          # Force activation hook to run (creates roles and capabilities)
          wp eval 'require_once ABSPATH . "wp-content/plugins/escalated/includes/class-activator.php"; Escalated\Activator::activate();' --allow-root 2>&1 || true

          # Ensure the admin user has ALL 52 Escalated capabilities
          wp cap add administrator \
            escalated_ticket_view escalated_ticket_create escalated_ticket_edit escalated_ticket_delete \
            escalated_ticket_assign escalated_ticket_merge escalated_ticket_close escalated_ticket_export \
            escalated_reply_create escalated_reply_create_internal escalated_reply_edit escalated_reply_delete \
            escalated_kb_view escalated_kb_create escalated_kb_edit escalated_kb_delete escalated_kb_publish \
            escalated_department_view escalated_department_create escalated_department_edit escalated_department_delete \
            escalated_report_view escalated_report_export \
            escalated_sla_view escalated_sla_manage \
            escalated_automation_view escalated_automation_manage \
            escalated_escalation_view escalated_escalation_manage \
            escalated_macro_view escalated_macro_create escalated_macro_manage \
            escalated_tag_view escalated_tag_manage \
            escalated_custom_field_view escalated_custom_field_manage \
            escalated_role_view escalated_role_manage \
            escalated_user_view escalated_user_manage \
            escalated_settings_view escalated_settings_manage \
            escalated_webhook_view escalated_webhook_manage \
            escalated_api_token_view escalated_api_token_manage \
            escalated_audit_view \
            escalated_plugin_view escalated_plugin_manage \
            escalated_custom_object_view escalated_custom_object_manage escalated_custom_object_data \
            --allow-root 2>&1 || true
          wp user add-role 1 administrator --allow-root 2>&1 || true

          # WP-Cron spawns on page loads, so the seeded automations run
          # while Playwright is walking the admin and rewrite the very data
          # being photographed. The first run with real data moved two
          # tickets from in_progress to escalated and pushed nine to high
          # priority, so the ticket list and the Reports page disagreed with
          # each other in the same pass.
          #
          # The rules stay active so the Automations screenshot shows a
          # working ruleset; cron is what gets switched off.
          wp config set DISABLE_WP_CRON true --raw --allow-root

          # Seed demo data for the screenshots.
          #
          # This used to be ~100 lines of PHP inside this YAML string, which
          # made it awkward to lint or run by hand. It lives in
          # screenshots/seed.php now and can be run against any WordPress
          # install with: wp eval-file screenshots/seed.php --allow-root
          wp eval-file $GITHUB_WORKSPACE/screenshots/seed.php --allow-root 2>&1

          # Start PHP built-in server
          php -S localhost:8080 -t /tmp/wordpress &
          sleep 3

          # Verify WordPress is responding
          curl -s -o /dev/null -w "WordPress HTTP status: %{http_code}\n" http://localhost:8080/wp-login.php

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd $GITHUB_WORKSPACE
          npm init -y
          npm install @playwright/test
          npx playwright install chromium --with-deps

      - name: Take Screenshots
        run: |
          cd $GITHUB_WORKSPACE
          npx playwright test screenshots/wp-admin.spec.js --config=screenshots/playwright.config.js --reporter=list

      - name: Upload Screenshots
        uses: actions/upload-artifact@v7
        with:
          name: escalated-wp-screenshots
          path: screenshots/results/

      - name: Commit Screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/results/
          git diff --staged --quiet || git commit -m "docs: update wp-admin screenshots [skip ci]"
          git push origin HEAD:main || true
