name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build plugin zip
        run: |
          mkdir -p build/escalated release

          rsync -av ./ build/escalated/ \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='screenshots' \
            --exclude='node_modules' \
            --exclude='phpunit.xml.dist' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='README.md'

          cd build
          zip -r ../release/escalated.zip escalated

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/escalated.zip
          generate_release_notes: true
