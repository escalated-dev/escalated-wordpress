name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install runtime Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build plugin zip
        run: |
          mkdir -p build/escalated release

          # Include vendor/ so escalated-dev/locale (central translations) ships
          # with the plugin. Without this, the plugin silently falls back to the
          # legacy in-tree languages/ catalog and misses portfolio-wide updates.
          rsync -av ./ build/escalated/ \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='screenshots' \
            --exclude='node_modules' \
            --exclude='phpunit.xml.dist' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='README.md'

          cd build
          zip -r ../release/escalated.zip escalated

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          files: release/escalated.zip
          generate_release_notes: true
